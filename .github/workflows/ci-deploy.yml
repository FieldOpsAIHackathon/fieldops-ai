name: Check and deploy FieldOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Replay and integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check replay, store, API and browser assets
        run: python scripts/ci_check.py
      - name: Check voice protocol and playback cancellation
        run: |
          python -m voice.check
          node voice/check_client.cjs
          bash -n voice/run.sh
      - name: Check deploy script syntax
        run: bash -n scripts/deploy_gb10.sh
      - name: Package the tested revision
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/fieldops-$GITHUB_SHA.tar.gz" \
            HEAD fieldops dashboard pitch data models openclaw scripts deploy voice README.md LICENSE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: fieldops-${{ github.sha }}
          path: ${{ runner.temp }}/fieldops-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy tested revision to GB10
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.FIELDOPS_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, linux, ARM64, fieldops-gb10]
    timeout-minutes: 10
    concurrency:
      group: fieldops-gb10
      cancel-in-progress: false
    steps:
      - name: Skip a revision superseded on main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/ref/heads/main"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]})
          with urllib.request.urlopen(req, timeout=20) as response:
              latest = json.load(response)["object"]["sha"]
          current = latest == os.environ["GITHUB_SHA"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"current={str(current).lower()}\n")
          print("Deploying current main" if current else "Skipping superseded revision")
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.head.outputs.current == 'true'
        with:
          name: fieldops-${{ github.sha }}
          path: ${{ runner.temp }}/fieldops-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Install release and check API health
        if: steps.head.outputs.current == 'true'
        run: |
          archive="$RUNNER_TEMP/fieldops-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/fieldops-$GITHUB_SHA.tar.gz"
          script="$RUNNER_TEMP/deploy-fieldops-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sh"
          tar -xOf "$archive" scripts/deploy_gb10.sh > "$script"
          bash "$script" "$archive" "$GITHUB_SHA"
