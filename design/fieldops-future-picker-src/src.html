<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design picks</title>
<!--PICKER-DECISIONS-->
<style>
/* Fonts: one @font-face per file in fonts/. build.mjs replaces {{FONT_<file>}}. */
@font-face { font-family: "Figtree"; src: url(data:font/woff2;base64,{{FONT_figtree}}) format("woff2"); font-weight: 400 800; font-display: block; }

/* ============ picker chrome (engine; leave alone) ============ */
:root { --pg:#E8E8E4; --panel:#F5F5F2; --ink:#1C1C1A; --ink2:#5D5D57; --rule:#D0D0CA; --sel:#1C1C1A; --onsel:#F5F5F2; --bezel:#0C0C0D; --chrome:#D6D6D1; --chromeDot:#B3B3AD; --chromeBar:#EDEDE9; color-scheme: light; }
:root[data-theme="dark"] { --pg:#141414; --panel:#1D1D1C; --ink:#EDEDE9; --ink2:#A5A59E; --rule:#33332F; --sel:#EDEDE9; --onsel:#141414; --bezel:#050506; --chrome:#2A2A2C; --chromeDot:#5A5A5E; --chromeBar:#3A3A3D; color-scheme: dark; }
/* Chrome rules never style mockups: element selectors are scoped to the chrome, since mockups may use h2, main and button. */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--pg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 28px 18px 28px 24px; border-right: 1px solid var(--rule); }
.rail h3 { font-size: 13px; font-weight: 600; color: var(--ink2); margin: 22px 0 8px; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail li a { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-radius: 8px; text-decoration: none; font-size: 14px; color: inherit; }
.rail li a:hover { background: var(--panel); }
.rail .st { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink2); flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700; }
.rail .st.on { background: var(--sel); border-color: var(--sel); color: var(--onsel); }
.rail .st.rec { border-style: dashed; }
.rail .pick { margin-left: auto; color: var(--ink2); font-size: 12px; text-align: right; }
.progress { font-size: 14px; } .progress b { font-size: 28px; font-weight: 650; display: block; line-height: 1.1; }
.bar { height: 4px; background: var(--rule); border-radius: 2px; margin: 10px 0 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sel); width: 0; transition: width .3s; }
.swatch { display: flex; gap: 6px; margin: 10px 0 26px; align-items: center; font-size: 12px; color: var(--ink2); }
.swatch i { width: 18px; height: 18px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px var(--rule); flex: none; }
.layout > main { padding: 36px 44px 140px; min-width: 0; }
.intro { max-width: 1120px; }
.intro h1 { font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 14px; font-weight: 700; }
.intro p { max-width: 68ch; margin: 0 0 12px; color: var(--ink2); font-size: 16px; }
.steps { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 18px 0 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 10px; align-items: baseline; }
.steps li::before { content: counter(s); font-weight: 700; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-grid; place-items: center; font-size: 13px; flex: none; transform: translateY(-1px); }
.found { margin: 28px 0 0; padding: 20px 24px; background: var(--panel); border-radius: 14px; }
.found h2 { font-size: 17px; margin: 0 0 10px; }
.found ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.controls { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 0; margin: 26px 0 0; background: var(--pg); border-bottom: 1px solid var(--rule); }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
.tog { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; padding: 3px; gap: 2px; }
.tog button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink2); }
.tog button[aria-pressed="true"] { background: var(--sel); color: var(--onsel); }
.cbtn { border: 1px solid var(--rule); background: var(--panel); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
.cbtn.main { background: var(--sel); color: var(--onsel); border-color: var(--sel); }
.grow { flex: 1; }
.decision { padding: 52px 0 44px; border-bottom: 1px solid var(--rule); scroll-margin-top: 64px; }
.dhead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.dhead h2 { font-size: 28px; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.dgroup { font-size: 13px; color: var(--ink2); }
.ask { font-size: 16px; margin: 6px 0 0; max-width: 70ch; }
.why { margin: 14px 0 22px; padding-left: 20px; color: var(--ink2); max-width: 90ch; display: grid; gap: 4px; }
.why b { color: var(--ink); font-weight: 600; }
.options { display: flex; flex-wrap: wrap; gap: 26px 22px; align-items: stretch; } /* equal-height options, so every Choose button lines up */
.opt { display: flex; flex-direction: column; gap: 10px; }
.opt.text { width: 300px; }
.ohead { display: flex; align-items: center; gap: 8px; min-height: 26px; white-space: nowrap; }
.ohead .oname { font-weight: 650; font-size: 16px; overflow: hidden; text-overflow: ellipsis; }
.letter { min-width: 26px; height: 26px; padding: 0 6px; border-radius: 7px; border: 1.5px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.opt.now .letter { border-style: dashed; color: var(--ink2); border-color: var(--ink2); font-size: 11px; }
.rec { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--ink2); color: var(--ink2); }
.odesc { font-size: 14px; color: var(--ink2); margin: 0; min-height: 42px; }
.nowcap { font-size: 12px; color: var(--ink2); margin: 0; }
.choose { margin-top: auto; width: 100%; border: 1px solid var(--rule); background: var(--panel); border-radius: 10px; padding: 10px; font-weight: 650; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.choose:hover { border-color: var(--ink2); }
.opt[data-chosen="true"] .choose { background: var(--sel); color: var(--onsel); border-color: var(--sel); }
.opt[data-chosen="true"] .dev, .opt[data-chosen="true"] .tcard { outline: 3px solid var(--sel); outline-offset: 4px; }
.play { align-self: flex-start; border: 1px solid var(--rule); background: none; border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.note { margin-top: 20px; max-width: 640px; }
.note label { font-size: 13px; color: var(--ink2); display: block; margin-bottom: 6px; }
.note textarea { width: 100%; min-height: 44px; resize: vertical; background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; }
.dev { position: relative; background: var(--bezel); display: block; cursor: zoom-in; box-shadow: 0 0 0 1px var(--rule), 0 14px 30px rgba(0,0,0,.18); }
.dev.phone { border-radius: 34px; padding: 7px; } .dev.phone .vp { border-radius: 27px; }
.dev.tablet { border-radius: 26px; padding: 10px; } .dev.tablet .vp { border-radius: 16px; }
.dev.browser { border-radius: 10px; padding: 0; } .dev.browser .vp { border-radius: 0 0 10px 10px; }
.dev.plain { border-radius: 12px; padding: 0; background: none; } .dev.plain .vp { border-radius: 12px; }
.bchrome { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: var(--chrome); border-radius: 10px 10px 0 0; }
.bchrome i { width: 10px; height: 10px; border-radius: 50%; background: var(--chromeDot); }
.bchrome span { flex: 1; height: 18px; margin-left: 10px; border-radius: 9px; background: var(--chromeBar); }
.dev.browser { background: var(--chrome); }
.vp { position: relative; overflow: hidden; }
.nowimg { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.tcard { background: var(--panel); border-radius: 16px; padding: 18px; box-shadow: 0 0 0 1px var(--rule); }
.tcard dl { margin: 0; display: grid; gap: 12px; } .tcard dt { font-size: 12px; color: var(--ink2); } .tcard dd { margin: 2px 0 0; font-size: 15px; font-weight: 550; }
.review { padding: 52px 0 0; } .review h2 { font-size: 28px; margin: 0 0 8px; }
.review table { border-collapse: collapse; width: 100%; max-width: 980px; margin: 18px 0 24px; font-size: 14px; }
.review th, .review td { text-align: left; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.review th { font-size: 12px; color: var(--ink2); font-weight: 600; }
.missing { color: var(--ink2); font-style: italic; }
.savebar { display: flex; flex-wrap: wrap; gap: 12px; } .savebar .cbtn { padding: 12px 18px; font-size: 15px; }
.status { font-size: 14px; color: var(--ink2); min-height: 22px; margin-top: 12px; }
.lb { position: fixed; inset: 0; z-index: 50; background: #0B0B0C; display: none; align-items: center; justify-content: center; gap: 36px; padding: 24px; }
.lb.open { display: flex; }
.lb .side { width: 300px; color: #EDEDE9; display: grid; gap: 14px; }
.lb .side h3 { margin: 0; font-size: 24px; line-height: 1.2; } .lb .side p { margin: 0; color: #C9C9C2; }
.lb .side .choose { background: #EDEDE9; color: #141414; border-color: #EDEDE9; }
.lb .side .ghost { background: none; color: #EDEDE9; border-color: #55554F; }
.lb .dev { cursor: default; }
.lb .side .lbnav { display: flex; gap: 8px; } .lb .side .lbnav .choose { flex: 1; }
.lb .side .lbpos { font-size: 13px; color: #A5A59E; }
body.shot .rail, body.shot .intro, body.shot .controls, body.shot .note, body.shot .review, body.shot .lb { display: none !important; }
body.shot .layout { display: block; } body.shot .layout > main { padding: 8px 28px 28px; } body.shot .decision { padding: 12px 0 0; border: 0; }
@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr; } .rail { display: none; } .layout > main { padding: 24px 16px 120px; } .intro h1 { font-size: 32px; }
  .options { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 12px; } .opt { scroll-snap-align: start; flex: none; }
  .lb { flex-direction: column; gap: 14px; overflow-y: auto; justify-content: flex-start; } .lb .side { width: 100%; max-width: 420px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } html { scroll-behavior: auto; } }

/* ============ walkthrough (engine; leave alone) ============ */
body.walk-open { overflow:hidden; touch-action:manipulation; }
body.walk-open > .layout, body.walk-open > .lb { display:none; }
.walk { -webkit-tap-highlight-color:transparent; position:fixed; inset:0; z-index:100; display:grid; grid-template-columns:260px minmax(0,1fr) 380px; background:var(--pg); color:var(--ink); font:14px/1.45 system-ui,sans-serif; }
.walk :is(button,select):not(.scr *) { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--rule); border-radius:8px; padding:7px 10px; cursor:pointer; }
.walk h2:not(.scr *) { font-size:19px; margin:0 0 16px; } .walk h3:not(.scr *) { font-size:14px; margin:20px 0 8px; }
.wleft, .wright { padding:20px; overflow:auto; } .wleft { border-right:1px solid var(--rule); } .wright { border-left:1px solid var(--rule); }
.wlist { display:grid; gap:6px; } .wlist button { text-align:left; } .walk [aria-current="true"]:not(.scr *) { outline:3px solid #3D7BFF; outline-offset:1px; }
.wcenter { min-width:0; display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; overflow:hidden; }
.wtools { display:flex; flex-wrap:wrap; gap:6px; align-items:center; } .wtools label { display:flex; gap:5px; align-items:center; }
.wstage { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
.walk .dev { cursor:default; flex:none; } .wviewport { position:relative; overflow:hidden; } .wlayer { position:absolute; inset:0; }
.whs { position:absolute; z-index:30; } .whints { position:absolute; inset:0; pointer-events:none; z-index:40; overflow:hidden; }
.whint { position:absolute; outline:2px solid #3D7BFF; background:rgba(61,123,255,.22); border-radius:4px; }
.wring { background:transparent; animation:wpulse 1.2s infinite; } .warrow { position:absolute; color:#3D7BFF; font:28px/1 system-ui; }
@keyframes wpulse { 50% { box-shadow:0 0 0 7px rgba(61,123,255,.22); } }
.wmap-scroll { overflow:auto; max-height:50vh; padding:5px; } .wmap { position:relative; } .wmap svg { position:absolute; inset:0; overflow:visible; }
.wnode { position:absolute; width:100px; text-align:center; cursor:pointer; border:1px solid var(--rule); border-radius:8px; background:var(--panel); padding:6px; } .wmini { position:relative; width:64px; overflow:hidden; margin:0 auto 5px; pointer-events:none; }
.wname { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:12px; line-height:1.3; }
.wnode small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink2); font-size:11px; }
.wgroup { position:absolute; color:var(--ink2); white-space:nowrap; font-size:11px; } .wtabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.wtour { background:#1D4ED8; color:#fff; border-radius:14px; padding:14px 16px; margin-top:12px; box-shadow:0 10px 30px rgba(0,0,0,.35); font:15px/1.45 system-ui,sans-serif; }
.wtour p { margin:6px 0 12px; } .wtour footer { display:flex; gap:8px; }
.walk .wtour button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.6); padding:7px 14px; }
.walk .wtour [data-wa="collapse"] { border:0; padding:0; font-size:12px; font-weight:600; opacity:.85; text-align:left; letter-spacing:.01em; }
.walk .wtour [data-wa="next"], .walk .wtour [data-wa="resume"] { background:#fff; color:#1D4ED8; border-color:#fff; font-weight:650; }
.wveil { position:absolute; inset:0; z-index:60; background:rgba(0,0,0,.5); display:flex; justify-content:center; align-items:flex-end; }
.wmenu { background:var(--pg); width:min(100%,600px); max-height:90%; overflow:auto; padding:20px; border-radius:20px 20px 0 0; } .wmenu .wtools { display:grid; }
.wmap-overlay { position:absolute; inset:0; z-index:65; background:var(--pg); padding:20px; overflow:auto; } .wmap-overlay .wmap-scroll { max-height:none; }
.wintro { position:absolute; z-index:55; bottom:24px; left:16px; right:16px; padding:18px; border-radius:14px; background:var(--panel); box-shadow:0 8px 40px #0008; }
.wmap-button { display:none; } .wphone { display:block; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; } /* a long-press opens the menu; selecting text would swallow the next tap */ .wphone > .wleft, .wphone > .wright, .wphone .wcenter > .wtools, .wphone .whelp { display:none; }
.wphone .wcenter, .wphone .wstage { position:absolute; inset:0; padding:0; display:block; }
.wphone .dev { padding:0; border-radius:0; box-shadow:none; } .wphone .wviewport { border-radius:0; } .wphone .bchrome { display:none; }
.wphone > .wtour { position:absolute; top:8px; left:12px; right:12px; z-index:50; margin:0; } .wphone > .wtour.wlow { top:auto; bottom:28px; } .wtour.wcollapsed p, .wtour.wcollapsed footer { display:none; }
.wprobe { position:fixed; left:-100000px; top:0; visibility:hidden; pointer-events:none; }
body.walk-shot { background:var(--wbg); } .walk.wshot { background:var(--wbg); }
.walk.wshot * { animation:none !important; transition:none !important; }
@media (max-width:1199px) { .walk:not(.wphone) { grid-template-columns:260px minmax(0,1fr); } .walk > .wright { display:none; } .wmap-button { display:inline-block; } }

/* ============ mockup kit (screen authored in device units, scaled) ============ */
.scr { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: calc(15px * var(--ts)); line-height: 1.34; overflow: hidden; -webkit-font-smoothing: antialiased; text-align: left; }
.scr * { box-sizing: border-box; } .scr svg { display: block; flex: none; }
/* Zero-specificity resets so semantic elements (h1-h4, p, lists, button, table) behave like divs and any kit class wins. */
:where(.scr) :where(h1,h2,h3,h4,p,ul,ol,figure,blockquote) { margin: 0; } :where(.scr) :where(ul,ol) { padding: 0; list-style: none; }
:where(.scr) :where(button,input,select,textarea) { font: inherit; color: inherit; background: none; border: 0; padding: 0; } :where(.scr) :where(table) { border-collapse: collapse; }
.sbar { position: absolute; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; padding: 0 22px 0 28px; font: 500 14px/1 var(--fb); color: var(--ink); z-index: 3; }
.sbar .ic3 { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.bd { position: absolute; top: 40px; left: 0; right: 0; bottom: 96px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.bd::-webkit-scrollbar { display: none; } .bd.full { bottom: 0; } .bd.web { top: 0; }
.gest { position: absolute; bottom: 7px; left: 50%; width: 110px; height: 4px; margin-left: -55px; border-radius: 2px; background: var(--ink); opacity: .5; z-index: 9; }
.px { padding-left: 20px; padding-right: 20px; } .row { display: flex; align-items: center; } .col { display: flex; flex-direction: column; } .btw { justify-content: space-between; } .wrap { flex-wrap: wrap; }
.g4 { gap: 4px; } .g6 { gap: 6px; } .g8 { gap: 8px; } .g10 { gap: 10px; } .g12 { gap: 12px; } .g16 { gap: 16px; } .g24 { gap: 24px; }
.mt4 { margin-top: 4px; } .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt20 { margin-top: 20px; } .mt24 { margin-top: 24px; } .mt32 { margin-top: 32px; }
.f1 { flex: 1; min-width: 0; } .pb { padding-bottom: 28px; }
.fs11 { font-size: calc(11px * var(--ts)); } .fs12 { font-size: calc(12px * var(--ts)); } .fs13 { font-size: calc(13px * var(--ts)); } .fs14 { font-size: calc(14px * var(--ts)); } .fs15 { font-size: calc(15px * var(--ts)); } .fs16 { font-size: calc(16px * var(--ts)); } .fs18 { font-size: calc(18px * var(--ts)); } .fs20 { font-size: calc(20px * var(--ts)); } .fs24 { font-size: calc(24px * var(--ts)); } .fs28 { font-size: calc(28px * var(--ts)); } .fs36 { font-size: calc(36px * var(--ts)); } .fs44 { font-size: calc(44px * var(--ts)); } .fs56 { font-size: calc(56px * var(--ts)); } .fs72 { font-size: calc(72px * var(--ts)); }
.fd { font-family: var(--fd); font-weight: var(--dw); letter-spacing: var(--dls); line-height: 1.15; }
.w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; }
.mut { color: var(--muted); } .pc { color: var(--primary); } .num { font-variant-numeric: tabular-nums; } .lh { line-height: 1.45; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .strike { text-decoration: line-through; color: var(--muted); }
.lbl { font-size: calc(12px * var(--ts)); font-weight: 600; color: var(--muted); }
.sec { font-family: var(--fd); font-weight: var(--dw); letter-spacing: var(--dls); font-size: calc(19px * var(--ts)); line-height: 1.2; }
.card { background: var(--surface); border-radius: var(--rl); padding: 16px; } .card.two { background: var(--surface2); }
.grp { background: var(--surface); border-radius: var(--rl); overflow: hidden; }
.r { position: relative; display: flex; align-items: center; gap: 14px; padding: 13px 16px; min-height: 60px; }
.grp > .r + .r::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: 1px; background: var(--line); }
.chips { display: flex; gap: 8px; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 13px; border-radius: var(--rchip); border: 1px solid var(--line); font-size: calc(13px * var(--ts)); font-weight: 600; white-space: nowrap; flex: none; }
.chip.on { background: var(--primarySoft); color: var(--onPrimarySoft); border-color: transparent; } .chip.info { background: var(--surface2); border-color: transparent; font-weight: 550; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--rchip); padding: 3px; gap: 2px; }
.seg span { flex: 1; text-align: center; padding: 8px; border-radius: max(calc(var(--rchip) - 3px), 4px); font-size: calc(13px * var(--ts)); font-weight: 650; color: var(--muted); white-space: nowrap; }
.seg .on { background: var(--primarySoft); color: var(--onPrimarySoft); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 10px 18px; border-radius: var(--rbtn); font-weight: 650; font-size: calc(15px * var(--ts)); text-align: center; }
.btn.pri { background: var(--primary); color: var(--onPrimary); } .btn.ton { background: var(--primarySoft); color: var(--onPrimarySoft); } .btn.out { border: 1px solid var(--line); }
.btn.sm { min-height: 36px; padding: 6px 13px; font-size: calc(13px * var(--ts)); } .btn.txt { min-height: 36px; padding: 6px 4px; color: var(--primary); }
.link { color: var(--primary); font-weight: 650; }
.field { border: 1px solid var(--line); border-radius: var(--rm); padding: 10px 14px; background: var(--surface); }

    return `<div class="sbar" style="${color ? `color:${color}` : ""}"><span>${time}</span><span class="ic3"><svg width="16" height="14" viewBox="0 0 16 14" fill="currentColor"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="4.3" y="6" width="3" height="8" rx="1"/><rect x="8.6" y="3" width="3" height="11" rx="1"/><rect x="12.9" y="0" width="3" height="14" rx="1"/></svg><svg width="16" height="14" viewBox="0 0 24 20" fill="currentColor"><path d="M12 19.5L0 5.5a17 17 0 0 1 24 0z"/></svg><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".75" y=".75" width="21.5" height="11.5" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/><rect x="2.6" y="2.6" width="15" height="7.8" rx="1.8" fill="currentColor"/></svg></span></div>`;
  },

  phone(body, { nav = "", over = "", pre = "", sbar = "", time } = {}) {
    return pre + K.statusBar(sbar, time) + `<div class="bd ${nav ? "" : "full"}">${body}</div>` + nav + over + `<div class="gest"></div>`;

  /* Web page / desktop app screen: one scrollable body, no status bar. */
  web(body, { over = "" } = {}) { return `<div class="bd web full">${body}</div>${over}`; },
  /* Bottom sheet over dimmed content. top = px from screen top. */
  sheet(content, { top = 56, foot = "" } = {}) {

  },
  esc: s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]))
};

function map(iso=false){let contours=Array.from({length:13},(_,i)=>`<ellipse class="fx-contour" cx="390" cy="220" rx="${240+i*24}" ry="${95+i*16}" transform="rotate(-16 390 220)"/>`).join('');let polys=BLOCKS.map((b,i)=>{let x=70+(i%3)*214,y=76+Math.floor(i/3)*143,open=i===2;let c=open?'var(--warn)':'var(--primary)';let rows=Array.from({length:8},(_,j)=>`<path d="M${x+20+j*20} ${y+15}l-9 105" stroke="${c}" opacity=".18" stroke-width="3" stroke-dasharray="2 6"/>`).join('');return `<g><path d="M${x+8} ${y}L${x+197} ${y-7}L${x+187} ${y+125}L${x} ${y+117}Z" fill="${c}" fill-opacity="${open?'.14':'.055'}" stroke="${c}" stroke-opacity="${open?'1':'.4'}" stroke-width="${open?2:1}"/>${rows}<rect x="${x+16}" y="${y+16}" width="168" height="49" rx="5" fill="var(--surface)" fill-opacity=".94"/><text class="fx-mapletter" x="${x+27}" y="${y+49}" fill="${c}">${b.name.slice(-1)}</text><text x="${x+62}" y="${y+36}" fill="var(--ink)">${b.variety}</text><text x="${x+62}" y="${y+55}" fill="${c}">${open?'Window open':'Accumulating'}</text>${[0,1,2].map((n)=>`<circle cx="${x+37+n*60}" cy="${y+91}" r="4" fill="${c}"/><circle cx="${x+37+n*60}" cy="${y+91}" r="9" fill="none" stroke="${c}" stroke-opacity=".22"/>`).join('')}</g>`}).join('');return `<div class="fx-map"><svg viewBox="0 0 780 390" role="img" aria-label="Schematic orchard, six blocks, Block C spray window open">${contours}<path d="M30 52L729 42 731 358 29 357Z" fill="none" stroke="var(--line)" stroke-dasharray="4 5"/><g ${iso?'transform="translate(115 -5) rotate(8 350 195) skewX(-14) scale(.85 1)"':''}>${polys}</g><text x="728" y="28" fill="var(--muted)">N ↑</text></svg><div class="fx-maplabel"><span>Schematic orchard • ${BLOCKS.reduce((s,b)=>s+b.acres,0).toFixed(1)} acres</span><span>◎ 18 trap locations</span></div></div>`}
function plot(kind='catch',small=false){const W=740,H=220,L=38,R=715,T=15,B=187;let vals=DAYS.map(d=>kind==='weather'?(d.tmin_f+d.tmax_f)/2:kind==='dd'?d.blocks['block-c'].dd_since_biofix:d.counts['block-c']);let other=DAYS.map(d=>kind==='weather'?d.tmax_f:kind==='dd'?d.blocks['block-a'].dd_since_biofix:Object.values(d.counts).reduce((a,b)=>a+b,0)/6);let max=kind==='dd'?350:kind==='weather'?90:50;let pt=(a)=>a.map((v,i)=>`${L+(R-L)*i/(a.length-1)},${B-(B-T)*v/max}`).join(' ');let line=(a)=>'M'+pt(a).replaceAll(' ',' L');return `<svg class="fx-plot" viewBox="0 0 ${W} ${H}" aria-label="${kind} chart from April 15 to June 4">${[0,.5,1].map(f=>`<line x1="${L}" x2="${R}" y1="${B-(B-T)*f}" y2="${B-(B-T)*f}" stroke="var(--line)"/><text x="${L-9}" y="${B-(B-T)*f+4}" text-anchor="end">${Math.round(max*f)}</text>`).join('')}${kind==='dd'?`<rect x="${L}" y="${T}" width="${R-L}" height="${(B-T)*100/350}" fill="var(--warn)" opacity=".07"/><text x="${L+10}" y="${T+20}" style="fill:var(--warn)">Spray window 250–350 DD</text>`:''}<path d="${line(vals)} L${R},${B} L${L},${B} Z" fill="var(--primary)" opacity=".07"/><polyline points="${pt(other)}" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 5"/><polyline points="${pt(vals)}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round"/><circle cx="${R}" cy="${B-(B-T)*vals.at(-1)/max}" r="4" fill="var(--primary)"/>${[['Apr 15','2026-04-15'],['May 1','2026-05-01'],['May 15','2026-05-15'],['Jun 4','2026-06-04']].map(([t,date],i)=>`<text x="${L+DAYS.findIndex(d=>d.date===date)*(R-L)/(DAYS.length-1)}" y="215" text-anchor="${i===3?'end':'start'}">${t}</text>`).join('')}</svg>`}
function chartCard(kind='catch'){return `<div class="fx-card"><div class="fx-cardhead"><h2>${kind==='dd'?'The biological clock':kind==='weather'?'Temperature profile':'Flight activity'}</h2><span class="fx-small">Apr 15 – Jun 4</span></div><div class="fx-chartkey"><span><i class="fx-linekey"></i>${kind==='weather'?'Daily mean':'Block C'}</span><span><i class="fx-linekey fx-dashed"></i>${kind==='weather'?'Daily high':kind==='dd'?'Block A':'Farm mean / block'}</span></div><div class="fx-pad">${plot(kind)}</div></div>`}

function blocks(ctx,alt){let grid=`<div class="fx-tilegrid">${BLOCKS.map(b=>`<div class="fx-card fx-pad ${b.id==='block-c'?'fx-alert':''}"><div class="fx-between"><span class="fx-letter">${b.name.slice(-1)}</span><span class="fx-small">${b.acres} acres</span></div><h2 style="margin-top:18px">${b.variety}</h2><div class="fx-number">${DAY.blocks[b.id].dd_since_biofix}<small> DD</small></div><span class="fx-tag">${b.id==='block-c'?'Window open':'Accumulating'}</span><div class="fx-progress"><i style="width:${DAY.blocks[b.id].dd_since_biofix/350*100}%"></i></div><div class="fx-small">${DAY.counts[b.id]} moths today / ${weekly(b.id)} this week</div></div>`).join('')}</div>`;return shell(ctx,2,alt?grid:`<div class="fx-grid"><div class="fx-card"><div class="fx-cardhead"><h2>Farm boundary & blocks</h2><span class="fx-small">Selected: C</span></div>${map(true)}<div class="fx-caption">Schematic map. Select a block for its pest history and timing.</div></div>${alertCard()}</div><div class="fx-bottom">${grid}</div>`,{title:alt?'Six blocks. One clear picture.':'Every block has a story.'})}

function traps(ctx,alt){return shell(ctx,3,`<div class="fx-strip"><span class="fx-picked">All 18 traps</span><span>Block C</span><span>Codling moth</span><span>Highest catch first</span></div>${alt?trapTable():`<div class="fx-grid"><div class="fx-card"><img class="fx-image fx-imagewide" src="${IMG.trap}" alt="Synthetic sticky trap sample containing 12 codling moths"><div class="fx-caption">Synthetic reference image / trap_03_codling012.jpg<br>Sample image is separate from the June 4 daily counts.</div></div><div class="fx-card fx-pad"><span class="fx-tag">Reference capture</span><h2 style="margin-top:18px">Inspect the evidence.</h2><div class="fx-number">12<small> codling moths</small></div><p>Manifest ground truth for this synthetic trap card. It is a visual reference, not a fresh model result.</p><div class="fx-rule"></div><div class="fx-small">June 4 • Orchard snapshot</div><div class="fx-row"><span>Traps reporting</span><span class="fx-spacer"></span><b>18 / 18</b></div><div class="fx-row"><span>Codling catch</span><span class="fx-spacer"></span><b>132</b></div><div class="fx-row"><span>Block C catch</span><span class="fx-spacer"></span><b>26</b></div></div></div><div class="fx-bottom">${trapTable()}</div>`}`,{title:alt?'Every reading, accounted for.':'From image to intelligence.'})}
function ddRanks(){return `<div class="fx-card"><div class="fx-cardhead"><h2>Progress toward the spray window</h2><span class="fx-small">Opens at 250 DD</span></div><div class="fx-ddlist">${BLOCKS.slice().sort((a,b)=>DAY.blocks[b.id].dd_since_biofix-DAY.blocks[a.id].dd_since_biofix).map(b=>`<div class="fx-ddrow"><b>${b.name}</b><div class="fx-progress ${b.id==='block-c'?'fx-amber':''}"><i style="width:${DAY.blocks[b.id].dd_since_biofix/350*100}%"></i></div><b>${DAY.blocks[b.id].dd_since_biofix}</b></div>`).join('')}</div><div class="fx-caption">Degree-days since each block’s biofix. Base 50°F, upper threshold 88°F.</div></div>`}

function agent(ctx,alt){return shell(ctx,5,alt?`<div class="fx-grid"><div class="fx-card fx-pad"><div class="fx-orb"></div><div class="fx-brief">Good timing changes<br>everything.</div><p style="font-size:calc(17px * var(--ts));margin-top:20px">Block C has entered its spray window at 261 DD. Block A is next in line at 246.5 DD, only 3.5 DD below the opening threshold.</p><div class="fx-rule"></div><div class="fx-between"><span class="fx-small">Season briefing / June 4</span><span class="fx-button">Read supporting facts</span></div><div class="fx-question">Ask a follow-up ${ic('note',18)}</div></div>${evidence()}</div>`:`<div class="fx-grid"><div class="fx-card fx-pad"><span class="fx-tag">FieldOps intelligence</span><div class="fx-question">Why does Block C need attention? ${ic('user',18)}</div><div class="fx-chat"><div class="fx-brief">Its spray window<br>opened today.</div><p>Block C has reached <b class="fx-accent">261 degree-days</b> since its May 8 biofix. The configured window begins at 250 DD and closes at 350 DD.</p><p>Today’s traps recorded <b>26 codling moths</b>. Block A is closest to following, at 246.5 DD.</p><div class="fx-strip" style="margin-top:20px"><span>Block C</span><span>Degree-day model</span><span>Trap counts</span></div></div><div class="fx-question">Ask about your orchard… ${ic('chev',20)}</div><div class="fx-small" style="margin-top:12px">Preview answer from committed season facts</div></div>${evidence()}</div>`,{title:alt?'Your orchard, explained.':'Ask. Understand. Act.',subtitle:'A clear explanation, with the facts always within reach.'})}
function cinema(ctx,alt){if(alt)return shell(ctx,0,`<div class="fx-grid"><div class="fx-card fx-pad"><span class="fx-small">Chapter 03 / The decision</span><div class="fx-brief" style="margin:20px 0">The window opens.<br>The grower knows.</div><p>June 4. Block C reaches 261 degree-days.</p><div class="fx-rule"></div><div class="fx-chartkey"><span><i class="fx-linekey"></i>Block C</span><span><i class="fx-linekey fx-dashed"></i>Block A</span></div>${plot('dd')}<div class="fx-chapters"><span>01 Detect</span><span>02 Understand</span><b>03 Act</b></div></div>${alertCard()}</div><div class="fx-bottom">${chartCard()}</div>`,{title:'The season story.',subtitle:'Presentation mode / chapter navigation',action:'Exit presentation'});return K.web(`<div class="fx-app"><div class="fx-cinema" style="width:100%"><div class="fx-between"><div class="fx-brand"><i class="fx-logo"></i>FieldOps</div><span class="fx-small">Nashoba Ridge / June 4, 2026</span></div><h1>The orchard speaks.<br><span class="fx-accent">Know when to act.</span></h1><div class="fx-grid"><div class="fx-card">${map(true)}</div>${alertCard()}</div><div class="fx-chapters"><b>03 / The decision</b><span>Block C</span><span>261 degree-days</span><span>Spray window open</span><span class="fx-spacer"></span><span>Next chapter ${ic('chev',16)}</span></div><div class="fx-small" style="margin-top:20px">Demo season / Schematic orchard</div></div></div>`)}
const option=(id,name,desc,r,value)=>({id,name,desc,r,...(value?{value}:{})});
const dec=(id,group,name,ask,why,opts,now='current',rec='A')=>({id,group,name,ask,why:[why],opts,rec,now,nowCap:'Current dashboard / June 4'});
PROJECT.decisions=[
{...dec('look','Foundation','Atmosphere','Which world should FieldOps live in?','The current pale orchard view lacks the cinematic depth requested for the video.',[option('A','Ion atlas','Deep blue instrument panels, crisp cyan data and a warm treatment signal.',c=>overview(c,false),'ion'),option('B','Dusk observatory','Violet layers and luminous lavender, with the flight curve leading the composition.',c=>overview(c,true),'vice')]),drives:'look',nowValue:'current'},

<script id="engine">
"use strict";
/* ================= engine: state, rendering, picking, saving ================= */
const P = PROJECT, DEC = P.decisions, FR = Object.assign({ kind: "phone", w: 395, h: 880, tile: 268, nowTile: 206 }, P.frame || {});
const TG = Object.assign({ mode: true, textSize: true, defaultMode: "dark", defaultTs: FR.kind === "phone" ? 1.15 : 1 }, P.toggles || {});
const Q = new URLSearchParams(location.search), SHOT = Q.get("only"), ONE = Q.get("screen");
const KEY = `${P.slug}-picks-v1`;
const state = { mode: TG.defaultMode, ts: TG.defaultTs, picks: {}, source: {}, notes: {} };
if (!SHOT && !ONE && !(P.walk && Q.has("walk"))) { try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.picks) Object.assign(state, s); } catch (e) {} }
if (Q.get("mode")) state.mode = Q.get("mode");
if (Q.get("ts")) state.ts = Number(Q.get("ts"));
if (Q.get("picks")) Q.get("picks").split(",").forEach(p => { const [d, o] = p.split(":"); if (d && o) state.picks[d] = o; });
const persist = () => { if (SHOT || ONE || (P.walk && Q.has("walk"))) return; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const eff = d => state.picks[d.id] || P.picks?.[d.id] || d.rec;
const optOf = (d, id) => d.opts.find(o => o.id === id);
function baseCtx() {
  const ctx = { mode: state.mode, ts: state.ts };
  DEC.filter(d => d.drives).forEach(d => { const p = eff(d); ctx[d.drives] = p === "now" ? d.nowValue : (optOf(d, p) || d.opts[0]).value; });
  return ctx;
}
function vars(ctx) {
  const looks = P.looks || {}, types = P.types || {};
  const L = looks[ctx.look] || Object.values(looks)[0], T = types[ctx.type] || Object.values(types)[0];
  let s = `--ts:${ctx.ts};`;
  if (T) s += `--fd:${T.fd},system-ui,sans-serif;--fb:${T.fb},system-ui,sans-serif;--dw:${T.dw};--dls:${T.dls};`;
  if (L) { const r = L.radius || {}; s += `--rl:${r.rl ?? 16}px;--rm:${r.rm ?? 12}px;--rbtn:${r.rbtn ?? 12}px;--rchip:${r.rchip ?? 8}px;`; const t = L[ctx.mode] || L.light; for (const k in t) s += `--${k}:${t[k]};`; }
  return s.replace(/"/g, "'");

      if (!points.size && multi) { multi = false; if (!moved && Date.now() - start < 500) menu(); } };
    host.addEventListener("pointerup",end); host.addEventListener("pointercancel",end); host.addEventListener("contextmenu",e => { if (phone) e.preventDefault(); });
  }
  addEventListener("popstate",e => {
    remember(false);
    if (!e.state?.walk) { if (host) close(); return; }
    if (pendingTab) { const id = pendingTab; pendingTab = null; busy = false; depth = 0; if (!host) return; tabFrom0(id); return; }
    depth = e.state.d || 0;
    const removed = entry(), next = e.state.walk.filter(e => ids.includes(e.id)); if (!next.length) { close(); return; }
    if (!host) { open(next.at(-1).id,false,next); return; }
    const reverse = next.length < stack.length || (removed?.how === "tab" && next.at(-1).id !== current()); stack = next;
    if (tour && tour.steps[tourIndex]?.at !== current()) leftTour = true;
    draw((reverse ? removed?.how : entry().how) || "replace",reverse);
  });
  addEventListener("hashchange",() => { if (location.hash.startsWith("#walk")) { if (!host) open(hashId()); else if (hashId() !== current()) setPath(hashId()); } else if (host && !shot) close(); });
  addEventListener("keydown",e => { if (!host || e.key !== "Escape") return; e.preventDefault(); const o = host.querySelectorAll(".wveil,.wmap-overlay"); if (o.length) o.forEach(el => el.remove()); else go("back"); });
  let resizeTimer; const onResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize,120); };
  addEventListener("resize",onResize); window.visualViewport?.addEventListener("resize",onResize);
  function hashId() { try { return decodeURIComponent(location.hash.slice(6)) || w.start; } catch (e) { return w.start; } }
  window.__walk = { report:inspect, go, current, stack:() => structuredClone(stack), debug:() => ({ busy, depth, tour:tour?.id || null, step:tourIndex, leftTour }) };
  const launch = document.createElement("button"); launch.id = "walkBtn"; launch.className = "cbtn"; launch.textContent = "Walk through it"; document.getElementById("saveTop").before(launch);
  /* The controls bar sits below a long intro; on a phone that is several screens down, so the way in also goes under the title. */
  const top = document.createElement("button"); top.id = "walkTop"; top.className = "cbtn main"; top.style.cssText = "margin:6px 0 18px;padding:12px 18px;font-size:15px"; top.textContent = "Walk through the app";
  document.querySelector("#intro h1")?.after(top);
  [launch,top].forEach(b => b.addEventListener("click",() => open(location.hash.startsWith("#walk") ? hashId() : w.start,true)));
  if (shot) {
    open(Q.get("walk") === "__report__" ? w.start : Q.get("walk"));
    if (Q.get("walk") === "__report__") { const pre = document.createElement("pre"); pre.id = "walkReport"; pre.textContent = JSON.stringify(inspect()); document.body.append(pre); }
  } else if (location.hash.startsWith("#walk")) open(hashId());
})();
</script>
